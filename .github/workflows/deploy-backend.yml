name: Deploy Backend

# Backend deployment must never package or write frontend public assets.
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
      - '!server/public/**'
      - '!server/public_backup_*/**'
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate backend before touching production
        run: |
          npm ci --no-audit --no-fund --prefix server
          npm run check:public-backups --prefix server
          npm test --prefix server
          node server/scripts/create-release-manifest.js --output server/release-manifest.json
          test "$(node -p "require('./server/release-manifest.json').release_sha")" = "$GITHUB_SHA"

      - name: Recover stale controlled Chromium processes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            stale_pattern='/opt/yinnkhome-chromium/.*/chrome'
            if command -v pgrep >/dev/null 2>&1; then
              pgrep -af "$stale_pattern" || true
            fi
            if command -v pkill >/dev/null 2>&1; then
              pkill -TERM -f "$stale_pattern" || true
              sleep 2
              pkill -KILL -f "$stale_pattern" || true
            fi

      # Do not switch/recover services before migration has been validated.
      - name: Check current backend without changing it
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            curl --max-time 15 -fsS http://127.0.0.1:3001/health

      - name: Stage Playwright-matched Chromium when the server needs it
        id: chrome-package
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          EXPECTED_SSH_HOST: 115.29.194.46
        run: |
          set -euo pipefail

          if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
            echo "Refusing to provision the stale or unrelated host: $SSH_HOST"
            exit 1
          fi
          if [ "$SSH_HOST" != "$EXPECTED_SSH_HOST" ]; then
            if ! getent ahosts "$SSH_HOST" | awk '{print $1}' | grep -qx "$EXPECTED_SSH_HOST"; then
              echo "SSH_HOST must be $EXPECTED_SSH_HOST or resolve to it; got $SSH_HOST"
              exit 1
            fi
          fi

          ssh_port="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_opts=(
            -i ~/.ssh/deploy_key
            -p "$ssh_port"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
          )
          remote="${SSH_USER}@${SSH_HOST}"
          playwright_version="$(node -p "require('./server/node_modules/playwright-core/package.json').version")"
          printf '%s\n' "$playwright_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Invalid locked Playwright version: $playwright_version"
            exit 1
          }
          chrome_marker="/opt/yinnkhome-chromium/playwright-core-${playwright_version}.ready"

          if ssh "${ssh_opts[@]}" "$remote" "CHROME_MARKER='$chrome_marker' bash -s" <<'REMOTE_CHECK'
            for chrome_command in google-chrome-stable google-chrome chromium chromium-browser; do
              chrome_candidate="$(command -v "$chrome_command" 2>/dev/null || true)"
              if [ -f "$CHROME_MARKER" ] && [ -n "$chrome_candidate" ] && [ -x "$chrome_candidate" ] && "$chrome_candidate" --version >/dev/null 2>&1; then
                exit 0
              fi
            done
            exit 1
          REMOTE_CHECK
          then
            echo 'The Playwright-matched Chromium is already installed; package staging is not required.'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_arch="$(ssh "${ssh_opts[@]}" "$remote" 'uname -m')"
          if [ "$remote_arch" != 'x86_64' ]; then
            echo "The locked Playwright Chromium build requires x86_64; server reports $remote_arch."
            exit 1
          fi

          server/node_modules/.bin/playwright-core install chromium
          chromium_executable="$(node -e "process.stdout.write(require('./server/node_modules/playwright-core').chromium.executablePath())")"
          test -x "$chromium_executable"
          chromium_payload_dir="$(dirname "$chromium_executable")"
          chromium_executable_name="$(basename "$chromium_executable")"
          chrome_archive="$RUNNER_TEMP/playwright-chromium.tar.gz"
          tar -C "$chromium_payload_dir" -czf "$chrome_archive" .
          chrome_archive_sha256="$(sha256sum "$chrome_archive" | awk '{print $1}')"
          printf '%s\n' "$chrome_archive_sha256" | grep -Eq '^[0-9a-f]{64}$' || {
            echo 'Failed to calculate the Playwright Chromium archive SHA-256.'
            exit 1
          }

          scp -i ~/.ssh/deploy_key -P "$ssh_port" \
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 \
            "$chrome_archive" "$remote:/tmp/yinnkhome-playwright-chromium.tar.gz"
          echo 'needed=true' >> "$GITHUB_OUTPUT"
          echo "sha256=$chrome_archive_sha256" >> "$GITHUB_OUTPUT"
          echo "executable_name=$chromium_executable_name" >> "$GITHUB_OUTPUT"
          echo "playwright_version=$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Provision Chromium for controlled ingestion rendering
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          EXPECTED_SSH_HOST: 115.29.194.46
          CHROME_PACKAGE_NEEDED: ${{ steps.chrome-package.outputs.needed }}
          CHROME_ARCHIVE_SHA256: ${{ steps.chrome-package.outputs.sha256 }}
          CHROME_EXECUTABLE_NAME: ${{ steps.chrome-package.outputs.executable_name }}
          CHROME_PLAYWRIGHT_VERSION: ${{ steps.chrome-package.outputs.playwright_version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: SSH_HOST,EXPECTED_SSH_HOST,CHROME_PACKAGE_NEEDED,CHROME_ARCHIVE_SHA256,CHROME_EXECUTABLE_NAME,CHROME_PLAYWRIGHT_VERSION
          script: |
            set -euo pipefail

            if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
              echo "Refusing to provision the stale or unrelated host: $SSH_HOST"
              exit 1
            fi
            if [ "$SSH_HOST" != "$EXPECTED_SSH_HOST" ]; then
              if ! getent ahosts "$SSH_HOST" | awk '{print $1}' | grep -qx "$EXPECTED_SSH_HOST"; then
                echo "SSH_HOST must be $EXPECTED_SSH_HOST or resolve to it; got $SSH_HOST"
                exit 1
              fi
            fi

            find_chromium() {
              for chrome_command in google-chrome-stable google-chrome chromium chromium-browser; do
                chrome_candidate="$(command -v "$chrome_command" 2>/dev/null || true)"
                if [ -n "$chrome_candidate" ] && [ -x "$chrome_candidate" ]; then
                  printf '%s\n' "$chrome_candidate"
                  return 0
                fi
              done
              return 1
            }

            if chromium_path="$(find_chromium)"; then
              if "$chromium_path" --version; then
                echo "Chromium is already provisioned: $chromium_path"
                exit 0
              fi
              echo "The existing Chromium executable is not runnable: $chromium_path"
            fi

            runner=''
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                runner='sudo'
              else
                echo 'Chromium provisioning requires root or passwordless sudo.'
                exit 1
              fi
            fi

            if [ "$CHROME_PACKAGE_NEEDED" != 'true' ]; then
              echo 'Chrome package was not staged even though no executable is available.'
              exit 1
            fi

            chrome_archive='/tmp/yinnkhome-playwright-chromium.tar.gz'
            chrome_dependency_log='/tmp/yinnkhome-chrome-dependencies.log'
            chrome_diagnostic='/tmp/yinnkhome-chrome-install-error.log'
            trap '$runner rm -f "$chrome_archive"' EXIT
            $runner rm -f "$chrome_diagnostic"
            write_chrome_diagnostic() {
              set +e
              {
                echo '--- operating system ---'
                cat /etc/os-release
                echo '--- architecture and RPM ---'
                uname -m
                rpm --version
                echo '--- managed Chrome files ---'
                find /opt/yinnkhome-chromium -maxdepth 2 -type f -name chrome -o -name google-chrome 2>/dev/null | head -20
                echo '--- missing shared libraries ---'
                if [ -n "${chrome_release:-}" ] && [ -x "$chrome_release/chrome" ]; then
                  ldd "$chrome_release/chrome" 2>&1 | grep 'not found' || true
                fi
                echo '--- dependency installation tail ---'
                tail -40 "$chrome_dependency_log" 2>/dev/null || true
                echo '--- Chrome version error ---'
                printf '%s\n' "${chrome_version_error:-not captured}"
              } > "$chrome_diagnostic"
            }
            test -s "$chrome_archive"
            printf '%s\n' "$CHROME_ARCHIVE_SHA256" | grep -Eq '^[0-9a-f]{64}$' || {
              echo 'The staged Chrome archive SHA-256 is missing or invalid.'
              exit 1
            }
            printf '%s\n' "$CHROME_EXECUTABLE_NAME" | grep -Eq '^[A-Za-z0-9._-]+$' || {
              echo 'The staged Chromium executable name is missing or invalid.'
              exit 1
            }
            printf '%s\n' "$CHROME_PLAYWRIGHT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo 'The staged Playwright version is missing or invalid.'
              exit 1
            }
            printf '%s  %s\n' "$CHROME_ARCHIVE_SHA256" "$chrome_archive" | sha256sum -c -

            # This browser revision is selected by the lockfile-pinned
            # playwright-core package. The payload is transferred over SSH and
            # pinned here by SHA-256.
            chrome_root='/opt/yinnkhome-chromium'
            chrome_release="$chrome_root/$CHROME_ARCHIVE_SHA256"
            $runner install -d -m 0755 "$chrome_root" "$chrome_release"
            if ! $runner tar -xzf "$chrome_archive" -C "$chrome_release"; then
              write_chrome_diagnostic
              exit 1
            fi
            if [ -f "$chrome_release/chrome-sandbox" ]; then
              $runner chmod 4755 "$chrome_release/chrome-sandbox"
            fi
            $runner ln -sfn "$chrome_release/$CHROME_EXECUTABLE_NAME" /usr/local/bin/google-chrome-stable

            chrome_runtime_dependencies=(
              'libatk-1.0.so.0()(64bit)'
              'libatk-bridge-2.0.so.0()(64bit)'
              'libcups.so.2()(64bit)'
              'libasound.so.2()(64bit)'
              'libgbm.so.1()(64bit)'
              'libpango-1.0.so.0()(64bit)'
              'libXcomposite.so.1()(64bit)'
              'libXdamage.so.1()(64bit)'
              'libXfixes.so.3()(64bit)'
              'libXrandr.so.2()(64bit)'
              'libatspi.so.0()(64bit)'
            )
            if command -v dnf >/dev/null 2>&1; then
              if ! $runner dnf install -y "${chrome_runtime_dependencies[@]}" 2>&1 | tee "$chrome_dependency_log"; then
                write_chrome_diagnostic
                exit 1
              fi
            elif command -v yum >/dev/null 2>&1; then
              if ! $runner yum install -y "${chrome_runtime_dependencies[@]}" 2>&1 | tee "$chrome_dependency_log"; then
                write_chrome_diagnostic
                exit 1
              fi
            else
              echo 'DNF or YUM is required to install Chrome runtime libraries.'
              write_chrome_diagnostic
              exit 1
            fi

            chromium_path="$(find_chromium)" || {
              echo 'Chromium package installation completed without an executable on PATH.'
              write_chrome_diagnostic
              exit 1
            }
            echo "Chromium provisioned successfully: $chromium_path"
            if ! chrome_version_error="$("$chromium_path" --version 2>&1)"; then
              write_chrome_diagnostic
              exit 1
            fi
            echo "$chrome_version_error"
            $runner touch "/opt/yinnkhome-chromium/playwright-core-${CHROME_PLAYWRIGHT_VERSION}.ready"
            rm -f "$chrome_dependency_log" "$chrome_diagnostic"

      - name: Report Chromium provisioning diagnostics
        if: failure() && steps.chrome-package.conclusion == 'success' && steps.chrome-package.outputs.needed == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_port="${SSH_PORT:-22}"
          diagnostic="$(ssh -i ~/.ssh/deploy_key -p "$ssh_port" \
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 \
            "${SSH_USER}@${SSH_HOST}" \
            'cat /tmp/yinnkhome-chrome-install-error.log 2>/dev/null || echo "No remote Chrome diagnostic was recorded."' \
            2>&1 || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Chromium provisioning failed::$diagnostic"

      - name: Upload backend over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          EXPECTED_SSH_HOST: 115.29.194.46
        run: |
          set -euo pipefail

          APP_DIR="${APP_DIR:-/opt/yinnkhome-backend}"
          ssh_port="${SSH_PORT:-22}"

          if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
            echo "Refusing to deploy to stale or unrelated host: $SSH_HOST"
            exit 1
          fi

          if [ "$SSH_HOST" != "$EXPECTED_SSH_HOST" ]; then
            if ! getent ahosts "$SSH_HOST" | awk '{print $1}' | grep -qx "$EXPECTED_SSH_HOST"; then
              echo "SSH_HOST must be $EXPECTED_SSH_HOST or resolve to it; got $SSH_HOST"
              exit 1
            fi
          fi

          case "$APP_DIR" in
            /opt/yinnkhome-backend) ;;
            /*) ;;
            *)
              echo "APP_DIR must be an absolute path, got: $APP_DIR"
              exit 1
              ;;
          esac

          case "$APP_DIR" in
            /|/var|/var/www|/var/www/*|*/server/public|*/server/public/*|*/public|*/public/*)
              echo "Refusing dangerous APP_DIR: $APP_DIR"
              exit 1
              ;;
          esac

          if [ -d server/public ]; then
            echo "server/public exists locally but will not be uploaded."
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh_opts=(
            -i ~/.ssh/deploy_key
            -p "$ssh_port"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
          )

          remote="${SSH_USER}@${SSH_HOST}"
          staging_dir="${APP_DIR}.deploy-tmp"

          tar -C server -czf /tmp/yinnkhome-backend.tar.gz \
            --exclude='./.env' \
            --exclude='./node_modules' \
            --exclude='./public' \
            --exclude='./public_backup_*' \
            --exclude='./uploads' \
            --exclude='./logs' \
            --exclude='./storage' \
            app.js \
            package.json \
            package-lock.json \
            ecosystem.config.cjs \
            .env.example \
            config \
            controllers \
            middleware \
            migrations \
            routes \
            scripts \
            services \
            utils \
            release-manifest.json

          ssh "${ssh_opts[@]}" "$remote" "rm -rf '$staging_dir' && mkdir -p '$staging_dir'"
          ssh "${ssh_opts[@]}" "$remote" "tar -xzf - -C '$staging_dir'" < /tmp/yinnkhome-backend.tar.gz

      - name: Deploy backend over SSH
        id: deploy-backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          EXPECTED_SSH_HOST: 115.29.194.46
          PRESENTATION_V2_API_KEY_SECRET: ${{ secrets.PRESENTATION_V2_API_KEY }}
          PRESENTATION_V2_BASE_URL_SECRET: ${{ secrets.PRESENTATION_V2_BASE_URL }}
          PRESENTATION_V2_MODEL_SECRET: ${{ secrets.PRESENTATION_V2_MODEL }}
          ADMIN_USERNAME_SECRET: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH_SECRET: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_TOKEN_VERSION_SECRET: ${{ secrets.ADMIN_TOKEN_VERSION }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: APP_DIR,SSH_HOST,EXPECTED_SSH_HOST,PRESENTATION_V2_API_KEY_SECRET,PRESENTATION_V2_BASE_URL_SECRET,PRESENTATION_V2_MODEL_SECRET,ADMIN_USERNAME_SECRET,ADMIN_PASSWORD_HASH_SECRET,ADMIN_TOKEN_VERSION_SECRET,RELEASE_SHA
          script: |
            set -euo pipefail
            deploy_log='/tmp/yinnkhome-backend-deploy.log'
            deploy_diagnostic='/tmp/yinnkhome-backend-deploy-error.log'
            rm -f "$deploy_log" "$deploy_diagnostic"
            exec > >(tee "$deploy_log") 2>&1
            deployment_phase='initialization'

            APP_DIR="${APP_DIR:-/opt/yinnkhome-backend}"

            if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
              echo "Refusing to deploy to stale or unrelated host: $SSH_HOST"
              exit 1
            fi

            case "$APP_DIR" in
              /opt/yinnkhome-backend) ;;
              /*) ;;
              *)
                echo "APP_DIR must be an absolute path, got: $APP_DIR"
                exit 1
                ;;
            esac

            case "$APP_DIR" in
              /|/var|/var/www|/var/www/*|*/server/public|*/server/public/*|*/public|*/public/*)
                echo "Refusing dangerous APP_DIR: $APP_DIR"
                exit 1
                ;;
            esac

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is required on the server"
              exit 1
            fi

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is required on the server"
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            # Chromium is provisioned in the explicit, auditable step above. The
            # application deployment itself does not install operating-system packages.
            # Static validation also requires pre-provisioned Fontconfig + CJK font.
            if ! command -v fc-match >/dev/null 2>&1 || ! command -v fc-list >/dev/null 2>&1; then
              echo 'AI PPT v2 static validation requires pre-provisioned Fontconfig.'
              exit 1
            fi
            if ! fc-list :lang=zh family 2>/dev/null | grep -Fqi 'Noto Sans CJK SC'; then
              echo 'AI PPT v2 static validation requires pre-provisioned Noto Sans CJK SC.'
              exit 1
            fi

            staging_dir="${APP_DIR}.deploy-tmp"
            backup_dir="${APP_DIR}.backup.$(date +%Y%m%d_%H%M%S)"
            activated="false"

            rollback() {
              exit_code=$?
              if [ "$exit_code" -ne 0 ]; then
                set +e
                {
                  echo "deployment_phase=$deployment_phase"
                  echo '--- deploy log tail ---'
                  tail -120 "$deploy_log" 2>/dev/null || true
                  echo '--- smoke stderr ---'
                  tail -80 /tmp/yinnkhome-smoke-err.log 2>/dev/null || true
                } > "$deploy_diagnostic"
                set -e
              fi
              if [ "$exit_code" -ne 0 ] && [ "$activated" = "true" ] && [ -d "$backup_dir" ]; then
                echo "Deployment failed; printing diagnostics before rollback."
                pm2 status || true
                if [ -f "$APP_DIR/logs/error.log" ]; then
                  echo "Recent backend error log:"
                  tail -n 120 "$APP_DIR/logs/error.log" || true
                fi
                if [ -f "$APP_DIR/logs/out.log" ]; then
                  echo "Recent backend output log:"
                  tail -n 80 "$APP_DIR/logs/out.log" || true
                fi
                echo "Deployment failed; rolling back to $backup_dir"
                rm -rf "$APP_DIR"
                mv "$backup_dir" "$APP_DIR"
                if [ -f "$APP_DIR/.env" ]; then
                  set -a
                  . "$APP_DIR/.env"
                  set +a
                elif [ -f "$APP_DIR/server/.env" ]; then
                  set -a
                  . "$APP_DIR/server/.env"
                  set +a
                fi
                if [ -f "$APP_DIR/ecosystem.config.cjs" ]; then
                  cd "$APP_DIR"
                  pm2 delete yinnkhome-backend || true
                  PORT="${PORT:-3001}" pm2 startOrReload ecosystem.config.cjs --env production --update-env || true
                elif [ -f "$APP_DIR/server/ecosystem.config.cjs" ]; then
                  cd "$APP_DIR/server"
                  pm2 delete yinnkhome-backend || true
                  PORT="${PORT:-3001}" pm2 startOrReload ecosystem.config.cjs --env production --update-env || true
                fi
                pm2 save || true
              fi
              exit "$exit_code"
            }
            trap rollback EXIT

            if [ ! -d "$staging_dir" ]; then
              echo "Missing uploaded staging directory: $staging_dir"
              exit 1
            fi

            if [ -d "$staging_dir/public" ] || find "$staging_dir" -maxdepth 1 -type d -name 'public_backup_*' | grep -q .; then
              echo "Refusing deploy: staging directory contains frontend static files."
              exit 1
            fi

            cd "$staging_dir"
            deployment_phase='install_dependencies'
            npm ci --omit=dev
            test "$(node -p "require('./release-manifest.json').release_sha")" = "$RELEASE_SHA"

            if [ -d "$APP_DIR" ]; then
              if [ -f "$APP_DIR/.env" ]; then
                cp -p "$APP_DIR/.env" "$staging_dir/.env"
              elif [ -f "$APP_DIR/server/.env" ]; then
                cp -p "$APP_DIR/server/.env" "$staging_dir/.env"
              fi
              for keep_dir in uploads logs storage; do
                if [ -d "$APP_DIR/$keep_dir" ]; then
                  rm -rf "$staging_dir/$keep_dir"
                  cp -a "$APP_DIR/$keep_dir" "$staging_dir/$keep_dir"
                elif [ -d "$APP_DIR/server/$keep_dir" ]; then
                  rm -rf "$staging_dir/$keep_dir"
                  cp -a "$APP_DIR/server/$keep_dir" "$staging_dir/$keep_dir"
                fi
              done

              public_source=""
              if [ -d "$APP_DIR/server/public" ]; then
                public_source="$APP_DIR/server/public"
              elif [ -d "$APP_DIR/public" ]; then
                public_source="$APP_DIR/public"
              else
                for candidate in $(ls -dt "${APP_DIR}".backup.* 2>/dev/null || true); do
                  if [ -d "$candidate/server/public" ]; then
                    public_source="$candidate/server/public"
                    break
                  elif [ -d "$candidate/public" ]; then
                    public_source="$candidate/public"
                    break
                  fi
                done
              fi

              if [ -n "$public_source" ]; then
                echo "Preserving existing server-side public directory from $public_source"
                rm -rf "$staging_dir/public"
                cp -a "$public_source" "$staging_dir/public"
                rm -rf "$staging_dir/server/public"
                mkdir -p "$staging_dir/server"
                cp -a "$staging_dir/public" "$staging_dir/server/public"
              else
                echo "No existing server-side public directory found to preserve."
              fi
            fi

            if [ -f .env ]; then
              # Independent designer projects are a released desktop feature.
              # Persist the production rollout while retaining the protocol
              # header gate that protects older clients.
              if grep -q '^FEATURE_INDEPENDENT_PROJECTS=' .env; then
                sed -i 's/^FEATURE_INDEPENDENT_PROJECTS=.*/FEATURE_INDEPENDENT_PROJECTS=true/' .env
              else
                printf '\nFEATURE_INDEPENDENT_PROJECTS=true\n' >> .env
              fi
              set -a
              . ./.env
              set +a
            fi

            set_env_value() {
              env_key="$1"
              env_value="$2"
              [ -n "$env_value" ] || return 0
              CONFIG_KEY="$env_key" CONFIG_VALUE="$env_value" node <<'NODE'
            const fs = require('fs');
            const file = '.env';
            const key = process.env.CONFIG_KEY;
            const value = process.env.CONFIG_VALUE;
            if (!key || /['\r\n]/.test(value)) throw new Error('Invalid environment value');
            const encoded = `'${value}'`;
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            const index = lines.findIndex(line => line.startsWith(`${key}=`));
            if (index >= 0) lines[index] = `${key}=${encoded}`;
            else lines.push(`${key}=${encoded}`);
            fs.writeFileSync(file, `${lines.join('\n').replace(/\n+$/, '')}\n`, { mode: 0o600 });
            NODE
            }

            v2_base_url="${PRESENTATION_V2_BASE_URL_SECRET:-${PRESENTATION_V2_BASE_URL:-https://llm-kudosu76rs0hp9is.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}}"
            v2_model="${PRESENTATION_V2_MODEL_SECRET:-${PRESENTATION_V2_MODEL:-qwen3.8-max}}"
            v2_api_key="${PRESENTATION_V2_API_KEY_SECRET:-${PRESENTATION_V2_API_KEY:-${DASHSCOPE_API_KEY:-}}}"
            case "${PRESENTATION_AI_MODEL:-}" in
              qwen*)
                v2_api_key="${v2_api_key:-${PRESENTATION_AI_API_KEY:-}}"
                v2_base_url="${PRESENTATION_V2_BASE_URL_SECRET:-${PRESENTATION_AI_BASE_URL:-$v2_base_url}}"
                ;;
            esac
            if [ -z "$v2_api_key" ]; then
              echo 'Missing PRESENTATION_V2_API_KEY. Add it as a GitHub Actions repository secret or to the production .env.'
              exit 1
            fi
            case "$v2_base_url" in
              https://*) ;;
              *) echo 'PRESENTATION_V2_BASE_URL must use HTTPS.'; exit 1 ;;
            esac

            set_env_value PRESENTATION_V2_BASE_URL "$v2_base_url"
            set_env_value PRESENTATION_V2_MODEL "$v2_model"
            set_env_value PRESENTATION_V2_API_KEY "$v2_api_key"
            set_env_value PRESENTATION_V2_ENDPOINT '/chat/completions'
            set_env_value PRESENTATION_V2_RENDER_VALIDATION 'static'
            set_env_value PRESENTATION_FC_MATCH "$(command -v fc-match)"
            set_env_value PRESENTATION_V2_FALLBACK_FONT 'Noto Sans CJK SC'
            set_env_value ADMIN_USERNAME "$ADMIN_USERNAME_SECRET"
            set_env_value ADMIN_PASSWORD_HASH "$ADMIN_PASSWORD_HASH_SECRET"
            set_env_value ADMIN_TOKEN_VERSION "$ADMIN_TOKEN_VERSION_SECRET"

            ingestion_chrome_path="${INGESTION_CHROME_PATH:-}"
            if [ -z "$ingestion_chrome_path" ] || [ ! -x "$ingestion_chrome_path" ]; then
              ingestion_chrome_path=""
              for chrome_command in google-chrome-stable google-chrome chromium chromium-browser; do
                chrome_candidate="$(command -v "$chrome_command" 2>/dev/null || true)"
                if [ -n "$chrome_candidate" ] && [ -x "$chrome_candidate" ]; then
                  ingestion_chrome_path="$chrome_candidate"
                  break
                fi
              done
            fi
            if [ -z "$ingestion_chrome_path" ]; then
              echo 'No pre-provisioned Chrome/Chromium executable is available for controlled ingestion rendering.'
              exit 1
            fi
            set_env_value INGESTION_CHROME_PATH "$ingestion_chrome_path"
            chmod 600 .env
            set -a
            . ./.env
            set +a

            echo 'Checking administrator authentication configuration.'
            deployment_phase='admin_auth_contract'
            node -e "require('./services/admin-auth').assertConfiguration()"

            echo 'Checking the production environment contract and read-only service connectivity.'
            deployment_phase='production_contract'
            timeout 120s npm run check:production-contract -- --connectivity

            echo 'Checking AI PPT v2 fonts and static PPTX generation.'
            deployment_phase='presentation_static_check'
            npm run check:presentation-v2
            model_check_id="$(printf '%s' "$PRESENTATION_V2_BASE_URL|$PRESENTATION_V2_MODEL|$PRESENTATION_V2_API_KEY" | sha256sum | cut -c1-20)"
            model_check_file="storage/presentation-v2-model-${model_check_id}.checked"
            if [ ! -f "$model_check_file" ]; then
              echo 'Checking AI PPT v2 multimodal model access.'
              deployment_phase='presentation_model_check'
              timeout 180s npm run check:presentation-v2:model
              mkdir -p storage
              : > "$model_check_file"
            fi

            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "mysqldump is required before starting the new backend code"
              exit 1
            fi
            private_root="${APP_DIR}.private"
            db_backup_dir="$private_root/db-backups"
            case "$db_backup_dir" in
              "$APP_DIR"|"$APP_DIR"/*)
                echo "Database backup directory must be outside the deployed application: $db_backup_dir"
                exit 1
                ;;
            esac
            install -m 700 -d "$private_root" "$db_backup_dir"

            # Older releases wrote backups below storage/, which is served by
            # Express. Relocate any such files before the new release starts.
            legacy_backup_batch="$db_backup_dir/legacy-$(date +%Y%m%d_%H%M%S)"
            legacy_found="false"
            relocate_legacy_backup_dir() {
              legacy_dir="$1"
              legacy_label="$2"
              if [ -L "$legacy_dir" ]; then
                echo "Refusing to relocate a symbolic-link backup directory: $legacy_dir"
                exit 1
              fi
              if [ -e "$legacy_dir" ]; then
                if [ ! -d "$legacy_dir" ]; then
                  echo "Legacy backup path is not a directory: $legacy_dir"
                  exit 1
                fi
                if [ "$legacy_found" = "false" ]; then
                  install -m 700 -d "$legacy_backup_batch"
                  legacy_found="true"
                fi
                echo "Relocating legacy database backup directory out of public storage: $legacy_dir"
                mv -- "$legacy_dir" "$legacy_backup_batch/$legacy_label"
              fi
            }
            relocate_legacy_backup_dir "$APP_DIR/storage/db-backups" app-storage
            relocate_legacy_backup_dir "$APP_DIR/server/storage/db-backups" server-storage
            if [ "$legacy_found" = "true" ]; then
              find "$legacy_backup_batch" -type f -exec chmod 600 {} +
            fi

            # storage/ is copied into staging to preserve runtime assets. Never
            # carry a legacy database backup copy into the activated release.
            rm -rf "$staging_dir/storage/db-backups" "$staging_dir/server/storage/db-backups"
            for legacy_dir in "$APP_DIR/storage/db-backups" "$APP_DIR/server/storage/db-backups"; do
              if [ -e "$legacy_dir" ] || [ -L "$legacy_dir" ]; then
                echo "Legacy public database backup path remains: $legacy_dir"
                exit 1
              fi
            done

            mkdir -p "$db_backup_dir"
            db_backup_file="$db_backup_dir/pre-deploy-${RELEASE_SHA:-unknown}-$(date +%Y%m%d_%H%M%S).sql.gz"
            echo "Creating database backup before smoke test: $db_backup_file"
            deployment_phase='database_backup'
            MYSQL_PWD="$DB_PASSWORD" mysqldump \
              --host="$DB_HOST" \
              --port="${DB_PORT:-3306}" \
              --user="$DB_USER" \
              --single-transaction \
              --quick \
              --skip-lock-tables \
              --no-tablespaces \
              "$DB_NAME" | gzip -c > "$db_backup_file"
            test -s "$db_backup_file"
            gzip -t "$db_backup_file"
            chmod 600 "$db_backup_file"

            echo "Applying recorded pending migrations before smoke test."
            deployment_phase='database_migrations'
            node scripts/run-pending-migrations.js
            node scripts/check-independent-project-schema.js
            echo "Checking original backend after migration, before service cutover."
            curl --max-time 15 -fsS "http://127.0.0.1:${PORT:-3001}/health"

            smoke_port=3099
            echo "Running backend smoke test on port $smoke_port before activation."
            deployment_phase='side_effect_free_smoke'
            APP_RUNTIME_MODE=smoke PORT="$smoke_port" node app.js > /tmp/yinnkhome-smoke-out.log 2> /tmp/yinnkhome-smoke-err.log &
            smoke_pid=$!
            smoke_ready="false"
            for attempt in $(seq 1 15); do
              if ! kill -0 "$smoke_pid" 2>/dev/null; then
                break
              fi
              if curl -fsS "http://127.0.0.1:${smoke_port}/health"; then
                smoke_ready="true"
                break
              fi
              sleep 1
            done
            if [ "$smoke_ready" != "true" ]; then
              echo "Smoke health check failed."
              echo "Smoke stdout:"
              cat /tmp/yinnkhome-smoke-out.log || true
              echo "Smoke stderr:"
              cat /tmp/yinnkhome-smoke-err.log || true
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
              exit 1
            fi
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" 2>/dev/null || true
            echo "Smoke test passed."

            if [ -d "$APP_DIR" ]; then
              mv "$APP_DIR" "$backup_dir"
            fi

            mkdir -p "$(dirname "$APP_DIR")"
            mv "$staging_dir" "$APP_DIR"
            activated="true"
            deployment_phase='service_activation'
            cd "$APP_DIR"

            mkdir -p uploads logs storage

            if [ ! -f .env ]; then
              echo "Missing .env on deployment host. Create it from .env.example before deploying."
              exit 1
            fi

            set -a
            . ./.env
            set +a

            # Read-only verification after activation; all DDL completed before cutover.
            node scripts/check-independent-project-schema.js

            # Abort only old OSS multipart uploads that are not referenced by
            # an active, unexpired release upload session.
            if ! node scripts/cleanup-orphan-release-uploads.js --apply --older-than-minutes=10; then
              echo "Warning: OSS orphan multipart cleanup could not run; deployment will continue."
            fi

            export PORT="${PORT:-3001}"
            pm2 delete yinnkhome-backend || true
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save

            deployment_phase='post_activation_health'
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT:-3001}/health"; then
                if [ -d "$backup_dir" ]; then
                  echo "Backend is healthy; keeping latest backup: $backup_dir"
                  for candidate in "${APP_DIR}".backup.*; do
                    [ -d "$candidate" ] || continue
                    [ "$candidate" = "$backup_dir" ] && continue
                    case "$candidate" in
                      "${APP_DIR}.backup."*)
                        echo "Removing old backend backup: $candidate"
                        rm -rf -- "$candidate"
                        ;;
                    esac
                  done
                else
                  echo "Backend is healthy; no previous deployment was available to back up."
                fi
                exit 0
              fi
              echo "Waiting for backend health check... ($attempt/30)"
              sleep 2
            done

            echo "Backend health check failed after waiting."
            exit 1

      - name: Report backend deployment diagnostics
        if: failure() && steps.deploy-backend.conclusion == 'failure'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_port="${SSH_PORT:-22}"
          diagnostic="$(ssh -i ~/.ssh/deploy_key -p "$ssh_port" \
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 \
            "${SSH_USER}@${SSH_HOST}" \
            'cat /tmp/yinnkhome-backend-deploy-error.log 2>/dev/null || echo "No remote backend diagnostic was recorded."' \
            2>&1 || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Backend deployment failed::$diagnostic"

      - name: Configure Nginx release upload timeouts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            runner=''
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                runner='sudo'
              else
                echo 'Deployment user needs root or passwordless sudo to configure Nginx.'
                exit 1
              fi
            fi

            nginx_conf_dir='/etc/nginx/conf.d'
            nginx_conf="$nginx_conf_dir/yinnkhome-upload-timeouts.conf"
            nginx_backup="${nginx_conf}.previous"
            nginx_tmp='/tmp/yinnkhome-upload-timeouts.conf'

            test -d "$nginx_conf_dir"
            command -v nginx >/dev/null 2>&1

            printf '%s\n' \
              '# Managed by deploy-backend.yml for large release package uploads.' \
              'client_max_body_size 1g;' \
              'client_body_timeout 1200s;' \
              'proxy_connect_timeout 30s;' \
              'proxy_send_timeout 1200s;' \
              'proxy_read_timeout 1200s;' \
              'send_timeout 1200s;' > "$nginx_tmp"

            had_previous='false'
            if $runner test -f "$nginx_conf"; then
              had_previous='true'
              $runner cp -p "$nginx_conf" "$nginx_backup"
            fi
            $runner install -m 644 "$nginx_tmp" "$nginx_conf"
            rm -f "$nginx_tmp"

            restore_nginx_conf() {
              if [ "$had_previous" = 'true' ]; then
                $runner mv "$nginx_backup" "$nginx_conf"
              else
                $runner rm -f "$nginx_conf"
              fi
            }

            if ! $runner nginx -t; then
              restore_nginx_conf
              $runner nginx -t
              exit 1
            fi
            if ! $runner nginx -T 2>&1 | grep -F "configuration file $nginx_conf" >/dev/null; then
              echo "$nginx_conf is not included by the active Nginx configuration."
              restore_nginx_conf
              $runner nginx -t
              exit 1
            fi

            if command -v systemctl >/dev/null 2>&1; then
              $runner systemctl reload nginx
            else
              $runner nginx -s reload
            fi
            $runner rm -f "$nginx_backup"
