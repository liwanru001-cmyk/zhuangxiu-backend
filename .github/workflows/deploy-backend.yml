name: Deploy Backend

# Backend deployment must never package or write frontend public assets.
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
      - '!server/public/**'
      - '!server/public_backup_*/**'
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate backend before touching production
        run: |
          npm ci --prefix server
          npm test --prefix server

      # Do not switch/recover services before migration has been validated.
      - name: Check current backend without changing it
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            curl --max-time 15 -fsS http://127.0.0.1:3001/health

      - name: Upload backend over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          EXPECTED_SSH_HOST: 115.29.194.46
        run: |
          set -euo pipefail

          APP_DIR="${APP_DIR:-/opt/yinnkhome-backend}"
          ssh_port="${SSH_PORT:-22}"

          if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
            echo "Refusing to deploy to stale or unrelated host: $SSH_HOST"
            exit 1
          fi

          if [ "$SSH_HOST" != "$EXPECTED_SSH_HOST" ]; then
            if ! getent ahosts "$SSH_HOST" | awk '{print $1}' | grep -qx "$EXPECTED_SSH_HOST"; then
              echo "SSH_HOST must be $EXPECTED_SSH_HOST or resolve to it; got $SSH_HOST"
              exit 1
            fi
          fi

          case "$APP_DIR" in
            /opt/yinnkhome-backend) ;;
            /*) ;;
            *)
              echo "APP_DIR must be an absolute path, got: $APP_DIR"
              exit 1
              ;;
          esac

          case "$APP_DIR" in
            /|/var|/var/www|/var/www/*|*/server/public|*/server/public/*|*/public|*/public/*)
              echo "Refusing dangerous APP_DIR: $APP_DIR"
              exit 1
              ;;
          esac

          if [ -d server/public ]; then
            echo "server/public exists locally but will not be uploaded."
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh_opts=(
            -i ~/.ssh/deploy_key
            -p "$ssh_port"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
          )

          remote="${SSH_USER}@${SSH_HOST}"
          staging_dir="${APP_DIR}.deploy-tmp"

          tar -C server -czf /tmp/yinnkhome-backend.tar.gz \
            --exclude='./.env' \
            --exclude='./node_modules' \
            --exclude='./public' \
            --exclude='./public_backup_*' \
            --exclude='./uploads' \
            --exclude='./logs' \
            --exclude='./storage' \
            app.js \
            package.json \
            package-lock.json \
            ecosystem.config.cjs \
            .env.example \
            config \
            controllers \
            middleware \
            migrations \
            routes \
            scripts \
            services \
            utils

          ssh "${ssh_opts[@]}" "$remote" "rm -rf '$staging_dir' && mkdir -p '$staging_dir'"
          ssh "${ssh_opts[@]}" "$remote" "tar -xzf - -C '$staging_dir'" < /tmp/yinnkhome-backend.tar.gz

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          EXPECTED_SSH_HOST: 115.29.194.46
          PRESENTATION_V2_API_KEY_SECRET: ${{ secrets.PRESENTATION_V2_API_KEY }}
          PRESENTATION_V2_BASE_URL_SECRET: ${{ secrets.PRESENTATION_V2_BASE_URL }}
          PRESENTATION_V2_MODEL_SECRET: ${{ secrets.PRESENTATION_V2_MODEL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 25m
          envs: APP_DIR,SSH_HOST,EXPECTED_SSH_HOST,PRESENTATION_V2_API_KEY_SECRET,PRESENTATION_V2_BASE_URL_SECRET,PRESENTATION_V2_MODEL_SECRET
          script: |
            set -euo pipefail

            APP_DIR="${APP_DIR:-/opt/yinnkhome-backend}"

            if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
              echo "Refusing to deploy to stale or unrelated host: $SSH_HOST"
              exit 1
            fi

            case "$APP_DIR" in
              /opt/yinnkhome-backend) ;;
              /*) ;;
              *)
                echo "APP_DIR must be an absolute path, got: $APP_DIR"
                exit 1
                ;;
            esac

            case "$APP_DIR" in
              /|/var|/var/www|/var/www/*|*/server/public|*/server/public/*|*/public|*/public/*)
                echo "Refusing dangerous APP_DIR: $APP_DIR"
                exit 1
                ;;
            esac

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is required on the server"
              exit 1
            fi

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is required on the server"
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            missing_presentation_runtime='false'
            for command_name in pdftoppm fc-match soffice; do
              if ! command -v "$command_name" >/dev/null 2>&1; then
                missing_presentation_runtime='true'
              fi
            done
            if ! fc-list :lang=zh family 2>/dev/null | grep -Fqi 'Noto Sans CJK SC'; then
              missing_presentation_runtime='true'
            fi
            if [ "$missing_presentation_runtime" = 'true' ]; then
              runner=''
              if [ "$(id -u)" -ne 0 ]; then
                if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                  runner='sudo'
                else
                  echo 'AI PPT v2 requires Poppler, Fontconfig, LibreOffice and a CJK font; passwordless sudo is unavailable.'
                  exit 1
                fi
              fi

              install_official_libreoffice_rpms() {
                libreoffice_version='25.8.7'
                libreoffice_archive="LibreOffice_${libreoffice_version}_Linux_x86-64_rpm.tar.gz"
                libreoffice_url="https://download.documentfoundation.org/libreoffice/stable/${libreoffice_version}/rpm/x86_64/${libreoffice_archive}"
                libreoffice_sha256='1b2d640d648c10ea7582c68ebc17fbb5f2551790deae40d2d9e4033fa2464d72'
                libreoffice_tmp="$(mktemp -d /tmp/yinnkhome-libreoffice.XXXXXX)"

                echo "Installing LibreOffice ${libreoffice_version} from the verified official RPM archive."
                curl -fL --retry 3 --connect-timeout 20 \
                  -o "$libreoffice_tmp/$libreoffice_archive" \
                  "$libreoffice_url"
                printf '%s  %s\n' \
                  "$libreoffice_sha256" \
                  "$libreoffice_tmp/$libreoffice_archive" \
                  | sha256sum -c -
                tar -xzf "$libreoffice_tmp/$libreoffice_archive" -C "$libreoffice_tmp"
                libreoffice_rpm_dir="$(find "$libreoffice_tmp" -type d -name RPMS -print -quit)"
                if [ -z "$libreoffice_rpm_dir" ]; then
                  echo 'The LibreOffice archive did not contain an RPMS directory.'
                  exit 1
                fi
                $runner dnf install -y "$libreoffice_rpm_dir"/*.rpm
                libreoffice_binary="$(find /opt -path '*/program/soffice' -type f -print -quit)"
                if [ -z "$libreoffice_binary" ]; then
                  echo 'LibreOffice was installed but soffice could not be located.'
                  exit 1
                fi
                $runner ln -sfn "$libreoffice_binary" /usr/local/bin/soffice
              }

              if command -v apt-get >/dev/null 2>&1; then
                $runner apt-get update
                $runner apt-get install -y --no-install-recommends \
                  poppler-utils fontconfig libreoffice-impress fonts-noto-cjk
              elif command -v dnf >/dev/null 2>&1; then
                $runner dnf install -y poppler-utils fontconfig
                if ! fc-list :lang=zh family 2>/dev/null | grep -Fqi 'Noto Sans CJK SC'; then
                  if $runner dnf install -y google-noto-sans-cjk-ttc-fonts; then
                    :
                  elif $runner dnf install -y google-noto-sans-cjk-fonts; then
                    :
                  else
                    echo 'Alibaba Cloud Linux has no supported Noto Sans CJK package.'
                    exit 1
                  fi
                fi
                if ! command -v soffice >/dev/null 2>&1; then
                  if $runner dnf install -y libreoffice-impress; then
                    :
                  else
                    install_official_libreoffice_rpms
                  fi
                fi
              elif command -v yum >/dev/null 2>&1; then
                $runner yum install -y poppler-utils fontconfig
                $runner yum install -y google-noto-sans-cjk-ttc-fonts
                $runner yum install -y libreoffice-impress
              else
                echo 'No supported package manager was found for the AI PPT v2 render runtime.'
                exit 1
              fi
              $runner fc-cache -f

              for command_name in pdftoppm fc-match soffice; do
                if ! command -v "$command_name" >/dev/null 2>&1; then
                  echo "AI PPT v2 runtime command is still unavailable: $command_name"
                  exit 1
                fi
              done
              if ! fc-list :lang=zh family 2>/dev/null | grep -Fqi 'Noto Sans CJK SC'; then
                echo 'Noto Sans CJK SC is still unavailable after installation.'
                exit 1
              fi
            fi

            staging_dir="${APP_DIR}.deploy-tmp"
            backup_dir="${APP_DIR}.backup.$(date +%Y%m%d_%H%M%S)"
            activated="false"

            rollback() {
              exit_code=$?
              if [ "$exit_code" -ne 0 ] && [ "$activated" = "true" ] && [ -d "$backup_dir" ]; then
                echo "Deployment failed; printing diagnostics before rollback."
                pm2 status || true
                if [ -f "$APP_DIR/logs/error.log" ]; then
                  echo "Recent backend error log:"
                  tail -n 120 "$APP_DIR/logs/error.log" || true
                fi
                if [ -f "$APP_DIR/logs/out.log" ]; then
                  echo "Recent backend output log:"
                  tail -n 80 "$APP_DIR/logs/out.log" || true
                fi
                echo "Deployment failed; rolling back to $backup_dir"
                rm -rf "$APP_DIR"
                mv "$backup_dir" "$APP_DIR"
                if [ -f "$APP_DIR/.env" ]; then
                  set -a
                  . "$APP_DIR/.env"
                  set +a
                elif [ -f "$APP_DIR/server/.env" ]; then
                  set -a
                  . "$APP_DIR/server/.env"
                  set +a
                fi
                if [ -f "$APP_DIR/ecosystem.config.cjs" ]; then
                  cd "$APP_DIR"
                  pm2 delete yinnkhome-backend || true
                  PORT="${PORT:-3001}" pm2 startOrReload ecosystem.config.cjs --env production --update-env || true
                elif [ -f "$APP_DIR/server/ecosystem.config.cjs" ]; then
                  cd "$APP_DIR/server"
                  pm2 delete yinnkhome-backend || true
                  PORT="${PORT:-3001}" pm2 startOrReload ecosystem.config.cjs --env production --update-env || true
                fi
                pm2 save || true
              fi
              exit "$exit_code"
            }
            trap rollback EXIT

            if [ ! -d "$staging_dir" ]; then
              echo "Missing uploaded staging directory: $staging_dir"
              exit 1
            fi

            if [ -d "$staging_dir/public" ] || find "$staging_dir" -maxdepth 1 -type d -name 'public_backup_*' | grep -q .; then
              echo "Refusing deploy: staging directory contains frontend static files."
              exit 1
            fi

            cd "$staging_dir"
            npm ci --omit=dev

            if [ -d "$APP_DIR" ]; then
              if [ -f "$APP_DIR/.env" ]; then
                cp -p "$APP_DIR/.env" "$staging_dir/.env"
              elif [ -f "$APP_DIR/server/.env" ]; then
                cp -p "$APP_DIR/server/.env" "$staging_dir/.env"
              fi
              for keep_dir in uploads logs storage; do
                if [ -d "$APP_DIR/$keep_dir" ]; then
                  rm -rf "$staging_dir/$keep_dir"
                  cp -a "$APP_DIR/$keep_dir" "$staging_dir/$keep_dir"
                elif [ -d "$APP_DIR/server/$keep_dir" ]; then
                  rm -rf "$staging_dir/$keep_dir"
                  cp -a "$APP_DIR/server/$keep_dir" "$staging_dir/$keep_dir"
                fi
              done

              public_source=""
              if [ -d "$APP_DIR/server/public" ]; then
                public_source="$APP_DIR/server/public"
              elif [ -d "$APP_DIR/public" ]; then
                public_source="$APP_DIR/public"
              else
                for candidate in $(ls -dt "${APP_DIR}".backup.* 2>/dev/null || true); do
                  if [ -d "$candidate/server/public" ]; then
                    public_source="$candidate/server/public"
                    break
                  elif [ -d "$candidate/public" ]; then
                    public_source="$candidate/public"
                    break
                  fi
                done
              fi

              if [ -n "$public_source" ]; then
                echo "Preserving existing server-side public directory from $public_source"
                rm -rf "$staging_dir/public"
                cp -a "$public_source" "$staging_dir/public"
                rm -rf "$staging_dir/server/public"
                mkdir -p "$staging_dir/server"
                cp -a "$staging_dir/public" "$staging_dir/server/public"
              else
                echo "No existing server-side public directory found to preserve."
              fi
            fi

            if [ -f .env ]; then
              # Independent designer projects are a released desktop feature.
              # Persist the production rollout while retaining the protocol
              # header gate that protects older clients.
              if grep -q '^FEATURE_INDEPENDENT_PROJECTS=' .env; then
                sed -i 's/^FEATURE_INDEPENDENT_PROJECTS=.*/FEATURE_INDEPENDENT_PROJECTS=true/' .env
              else
                printf '\nFEATURE_INDEPENDENT_PROJECTS=true\n' >> .env
              fi
              set -a
              . ./.env
              set +a
            fi

            set_env_value() {
              env_key="$1"
              env_value="$2"
              [ -n "$env_value" ] || return 0
              CONFIG_KEY="$env_key" CONFIG_VALUE="$env_value" node <<'NODE'
            const fs = require('fs');
            const file = '.env';
            const key = process.env.CONFIG_KEY;
            const value = process.env.CONFIG_VALUE;
            if (!key || /[\r\n]/.test(value)) throw new Error('Invalid environment value');
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            const index = lines.findIndex(line => line.startsWith(`${key}=`));
            if (index >= 0) lines[index] = `${key}=${value}`;
            else lines.push(`${key}=${value}`);
            fs.writeFileSync(file, `${lines.join('\n').replace(/\n+$/, '')}\n`, { mode: 0o600 });
            NODE
            }

            v2_base_url="${PRESENTATION_V2_BASE_URL_SECRET:-${PRESENTATION_V2_BASE_URL:-https://llm-kudosu76rs0hp9is.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}}"
            v2_model="${PRESENTATION_V2_MODEL_SECRET:-${PRESENTATION_V2_MODEL:-qwen3.8-max}}"
            v2_api_key="${PRESENTATION_V2_API_KEY_SECRET:-${PRESENTATION_V2_API_KEY:-${DASHSCOPE_API_KEY:-}}}"
            case "${PRESENTATION_AI_MODEL:-}" in
              qwen*)
                v2_api_key="${v2_api_key:-${PRESENTATION_AI_API_KEY:-}}"
                v2_base_url="${PRESENTATION_V2_BASE_URL_SECRET:-${PRESENTATION_AI_BASE_URL:-$v2_base_url}}"
                ;;
            esac
            if [ -z "$v2_api_key" ]; then
              echo 'Missing PRESENTATION_V2_API_KEY. Add it as a GitHub Actions repository secret or to the production .env.'
              exit 1
            fi
            case "$v2_base_url" in
              https://*) ;;
              *) echo 'PRESENTATION_V2_BASE_URL must use HTTPS.'; exit 1 ;;
            esac

            set_env_value PRESENTATION_V2_BASE_URL "$v2_base_url"
            set_env_value PRESENTATION_V2_MODEL "$v2_model"
            set_env_value PRESENTATION_V2_API_KEY "$v2_api_key"
            set_env_value PRESENTATION_V2_ENDPOINT '/chat/completions'
            set_env_value PRESENTATION_SOFFICE "$(command -v soffice)"
            set_env_value PRESENTATION_FC_MATCH "$(command -v fc-match)"
            set_env_value PRESENTATION_PDFTOPPM "$(command -v pdftoppm)"
            set_env_value PRESENTATION_V2_FALLBACK_FONT 'Noto Sans CJK SC'
            chmod 600 .env
            set -a
            . ./.env
            set +a

            echo 'Checking AI PPT v2 fonts and headless rendering.'
            npm run check:presentation-v2
            model_check_id="$(printf '%s' "$PRESENTATION_V2_BASE_URL|$PRESENTATION_V2_MODEL|$PRESENTATION_V2_API_KEY" | sha256sum | cut -c1-20)"
            model_check_file="storage/presentation-v2-model-${model_check_id}.checked"
            if [ ! -f "$model_check_file" ]; then
              echo 'Checking AI PPT v2 multimodal model access.'
              npm run check:presentation-v2:model
              mkdir -p storage
              : > "$model_check_file"
            fi

            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "mysqldump is required before starting the new backend code"
              exit 1
            fi
            db_backup_dir="$staging_dir/storage/db-backups"
            mkdir -p "$db_backup_dir"
            db_backup_file="$db_backup_dir/pre-deploy-$(date +%Y%m%d_%H%M%S).sql.gz"
            echo "Creating database backup before smoke test: $db_backup_file"
            MYSQL_PWD="$DB_PASSWORD" mysqldump \
              --host="$DB_HOST" \
              --port="${DB_PORT:-3306}" \
              --user="$DB_USER" \
              --single-transaction \
              --quick \
              --skip-lock-tables \
              --no-tablespaces \
              "$DB_NAME" | gzip -c > "$db_backup_file"
            test -s "$db_backup_file"
            gzip -t "$db_backup_file"

            echo "Applying recorded pending migrations before smoke test."
            node scripts/run-pending-migrations.js
            node scripts/check-independent-project-schema.js
            echo "Checking original backend after migration, before service cutover."
            curl --max-time 15 -fsS "http://127.0.0.1:${PORT:-3001}/health"

            smoke_port=3099
            echo "Running backend smoke test on port $smoke_port before activation."
            PORT="$smoke_port" node app.js > /tmp/yinnkhome-smoke-out.log 2> /tmp/yinnkhome-smoke-err.log &
            smoke_pid=$!
            smoke_ready="false"
            for attempt in $(seq 1 15); do
              if ! kill -0 "$smoke_pid" 2>/dev/null; then
                break
              fi
              if curl -fsS "http://127.0.0.1:${smoke_port}/health"; then
                smoke_ready="true"
                break
              fi
              sleep 1
            done
            if [ "$smoke_ready" != "true" ]; then
              echo "Smoke health check failed."
              echo "Smoke stdout:"
              cat /tmp/yinnkhome-smoke-out.log || true
              echo "Smoke stderr:"
              cat /tmp/yinnkhome-smoke-err.log || true
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
              exit 1
            fi
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" 2>/dev/null || true
            echo "Smoke test passed."

            if [ -d "$APP_DIR" ]; then
              mv "$APP_DIR" "$backup_dir"
            fi

            mkdir -p "$(dirname "$APP_DIR")"
            mv "$staging_dir" "$APP_DIR"
            activated="true"
            cd "$APP_DIR"

            mkdir -p uploads logs storage

            if [ ! -f .env ]; then
              echo "Missing .env on deployment host. Create it from .env.example before deploying."
              exit 1
            fi

            set -a
            . ./.env
            set +a

            # Read-only verification after activation; all DDL completed before cutover.
            node scripts/check-independent-project-schema.js

            # Abort only old OSS multipart uploads that are not referenced by
            # an active, unexpired release upload session.
            if ! node scripts/cleanup-orphan-release-uploads.js --apply --older-than-minutes=10; then
              echo "Warning: OSS orphan multipart cleanup could not run; deployment will continue."
            fi

            export PORT="${PORT:-3001}"
            pm2 delete yinnkhome-backend || true
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save

            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT:-3001}/health"; then
                if [ -d "$backup_dir" ]; then
                  echo "Backend is healthy; keeping latest backup: $backup_dir"
                  for candidate in "${APP_DIR}".backup.*; do
                    [ -d "$candidate" ] || continue
                    [ "$candidate" = "$backup_dir" ] && continue
                    case "$candidate" in
                      "${APP_DIR}.backup."*)
                        echo "Removing old backend backup: $candidate"
                        rm -rf -- "$candidate"
                        ;;
                    esac
                  done
                else
                  echo "Backend is healthy; no previous deployment was available to back up."
                fi
                exit 0
              fi
              echo "Waiting for backend health check... ($attempt/30)"
              sleep 2
            done

            echo "Backend health check failed after waiting."
            exit 1

      - name: Configure Nginx release upload timeouts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            runner=''
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                runner='sudo'
              else
                echo 'Deployment user needs root or passwordless sudo to configure Nginx.'
                exit 1
              fi
            fi

            nginx_conf_dir='/etc/nginx/conf.d'
            nginx_conf="$nginx_conf_dir/yinnkhome-upload-timeouts.conf"
            nginx_backup="${nginx_conf}.previous"
            nginx_tmp='/tmp/yinnkhome-upload-timeouts.conf'

            test -d "$nginx_conf_dir"
            command -v nginx >/dev/null 2>&1

            printf '%s\n' \
              '# Managed by deploy-backend.yml for large release package uploads.' \
              'client_max_body_size 1g;' \
              'client_body_timeout 1200s;' \
              'proxy_connect_timeout 30s;' \
              'proxy_send_timeout 1200s;' \
              'proxy_read_timeout 1200s;' \
              'send_timeout 1200s;' > "$nginx_tmp"

            had_previous='false'
            if $runner test -f "$nginx_conf"; then
              had_previous='true'
              $runner cp -p "$nginx_conf" "$nginx_backup"
            fi
            $runner install -m 644 "$nginx_tmp" "$nginx_conf"
            rm -f "$nginx_tmp"

            restore_nginx_conf() {
              if [ "$had_previous" = 'true' ]; then
                $runner mv "$nginx_backup" "$nginx_conf"
              else
                $runner rm -f "$nginx_conf"
              fi
            }

            if ! $runner nginx -t; then
              restore_nginx_conf
              $runner nginx -t
              exit 1
            fi
            if ! $runner nginx -T 2>&1 | grep -F "configuration file $nginx_conf" >/dev/null; then
              echo "$nginx_conf is not included by the active Nginx configuration."
              restore_nginx_conf
              $runner nginx -t
              exit 1
            fi

            if command -v systemctl >/dev/null 2>&1; then
              $runner systemctl reload nginx
            else
              $runner nginx -s reload
            fi
            $runner rm -f "$nginx_backup"
