name: Deploy Public Static Pages

on:
  push:
    branches:
      - main
    paths:
      - 'server/public/downloads/**'
      - 'server/public/merchant/**'
      - 'server/public/favicon.png'
      - 'server/public/assets/app_icon.png'
      - 'server/public/assets/screens/**'
      - '.github/workflows/deploy-merchant-portal.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate merchant portal artifact
        run: |
          set -euo pipefail
          test -f server/public/index.html
          test -f server/public/downloads/index.html
          test -f server/public/merchant/index.html
          test -f server/public/favicon.png
          test -f server/public/assets/app_icon.png
          test "$(find server/public/assets/screens -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" = "6"
          test ! -f server/public/index.html.tmp

      - name: Wait for backend deploy on same commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          found_backend_run="false"
          for attempt in $(seq 1 90); do
            response="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/deploy-backend.yml/runs?head_sha=$SHA&event=push&per_page=1")"
            read -r count status conclusion url < <(python3 -c 'import json, sys; data=json.load(sys.stdin); runs=data.get("workflow_runs") or []; print("0 none none none" if not runs else "%s %s %s %s" % (len(runs), runs[0].get("status") or "none", runs[0].get("conclusion") or "none", runs[0].get("html_url") or "none"))' <<< "$response")

            if [ "$count" = "0" ]; then
              if [ "$attempt" -ge 5 ]; then
                echo "No backend deploy run found for this commit; continuing with static-only deploy."
                exit 0
              fi
              sleep 2
              continue
            fi

            found_backend_run="true"
            echo "Backend deploy run: $status / $conclusion - $url"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "Backend deploy did not succeed; refusing to publish public static pages."
              exit 1
            fi
            sleep 5
          done

          if [ "$found_backend_run" = "true" ]; then
            echo "Timed out waiting for backend deploy on same commit."
            exit 1
          fi

      - name: Upload merchant portal over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          MERCHANT_PUBLIC_DIR: ${{ secrets.MERCHANT_PUBLIC_DIR }}
          EXPECTED_SSH_HOST: 115.29.194.46
        run: |
          set -euo pipefail

          ssh_port="${SSH_PORT:-22}"

          MERCHANT_PUBLIC_DIR="/opt/yinnkhome-backend/server/public"

          if [ "$SSH_HOST" = "47.114.87.69" ] || [ "$SSH_HOST" = "118.178.123.31" ]; then
            echo "Refusing to deploy to stale or unrelated host: $SSH_HOST"
            exit 1
          fi

          if [ "$SSH_HOST" != "$EXPECTED_SSH_HOST" ]; then
            if ! getent ahosts "$SSH_HOST" | awk '{print $1}' | grep -qx "$EXPECTED_SSH_HOST"; then
              echo "SSH_HOST must be $EXPECTED_SSH_HOST or resolve to it; got $SSH_HOST"
              exit 1
            fi
          fi

          case "$MERCHANT_PUBLIC_DIR" in
            /*) ;;
            *)
              echo "MERCHANT_PUBLIC_DIR must be an absolute path, got: $MERCHANT_PUBLIC_DIR"
              exit 1
              ;;
          esac

          case "$MERCHANT_PUBLIC_DIR" in
            /opt/yinnkhome-backend/server/public) ;;
            *)
              echo "Refusing dangerous MERCHANT_PUBLIC_DIR: $MERCHANT_PUBLIC_DIR"
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh_opts=(
            -i ~/.ssh/deploy_key
            -p "$ssh_port"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
          )
          scp_opts=(
            -i ~/.ssh/deploy_key
            -P "$ssh_port"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
          )

          remote="${SSH_USER}@${SSH_HOST}"
          remote_home_tmp="/tmp/yinnkhome-home-index-${GITHUB_RUN_ID}.html"
          remote_downloads_tmp="/tmp/yinnkhome-downloads-index-${GITHUB_RUN_ID}.html"
          remote_merchant_tmp="/tmp/yinnkhome-merchant-index-${GITHUB_RUN_ID}.html"
          remote_favicon_tmp="/tmp/yinnkhome-favicon-${GITHUB_RUN_ID}.png"
          remote_app_icon_tmp="/tmp/yinnkhome-app-icon-${GITHUB_RUN_ID}.png"
          remote_screens_tmp="/tmp/yinnkhome-screens-${GITHUB_RUN_ID}.tar.gz"

          tar -C server/public/assets/screens -czf /tmp/yinnkhome-screens.tar.gz .
          scp "${scp_opts[@]}" server/public/index.html "$remote:$remote_home_tmp"
          scp "${scp_opts[@]}" server/public/downloads/index.html "$remote:$remote_downloads_tmp"
          scp "${scp_opts[@]}" server/public/merchant/index.html "$remote:$remote_merchant_tmp"
          scp "${scp_opts[@]}" server/public/favicon.png "$remote:$remote_favicon_tmp"
          scp "${scp_opts[@]}" server/public/assets/app_icon.png "$remote:$remote_app_icon_tmp"
          scp "${scp_opts[@]}" /tmp/yinnkhome-screens.tar.gz "$remote:$remote_screens_tmp"
          ssh "${ssh_opts[@]}" "$remote" \
            "set -euo pipefail
             runner=''
             if [ \"\$(id -u)\" -ne 0 ]; then
               if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                 runner='sudo'
               else
                 echo 'Deployment user needs root or passwordless sudo to write merchant portal.'
                 exit 1
               fi
             fi
             \$runner mkdir -p '$MERCHANT_PUBLIC_DIR/merchant' '$MERCHANT_PUBLIC_DIR/downloads' '$MERCHANT_PUBLIC_DIR/assets/screens'
             screens_ready='/tmp/yinnkhome-screens-ready-${GITHUB_RUN_ID}'
             rm -rf \"\$screens_ready\"
             mkdir -p \"\$screens_ready\"
             tar -xzf '$remote_screens_tmp' -C \"\$screens_ready\"
             test \"\$(find \"\$screens_ready\" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')\" = '6'
             cp '$remote_home_tmp' /tmp/yinnkhome-home-index-ready.html
             cp '$remote_downloads_tmp' /tmp/yinnkhome-downloads-index-ready.html
             cp '$remote_merchant_tmp' /tmp/yinnkhome-merchant-index-ready.html
             \$runner cp /tmp/yinnkhome-home-index-ready.html '$MERCHANT_PUBLIC_DIR/index.html.tmp'
             \$runner cp /tmp/yinnkhome-downloads-index-ready.html '$MERCHANT_PUBLIC_DIR/downloads/index.html.tmp'
             \$runner cp /tmp/yinnkhome-merchant-index-ready.html '$MERCHANT_PUBLIC_DIR/merchant/index.html.tmp'
             \$runner mv '$MERCHANT_PUBLIC_DIR/index.html.tmp' '$MERCHANT_PUBLIC_DIR/index.html'
             \$runner mv '$MERCHANT_PUBLIC_DIR/downloads/index.html.tmp' '$MERCHANT_PUBLIC_DIR/downloads/index.html'
             \$runner mv '$MERCHANT_PUBLIC_DIR/merchant/index.html.tmp' '$MERCHANT_PUBLIC_DIR/merchant/index.html'
             \$runner cp '$remote_favicon_tmp' '$MERCHANT_PUBLIC_DIR/favicon.png'
             \$runner cp '$remote_app_icon_tmp' '$MERCHANT_PUBLIC_DIR/assets/app_icon.png'
             \$runner cp -a \"\$screens_ready/.\" '$MERCHANT_PUBLIC_DIR/assets/screens/'
             rm -f '$remote_home_tmp'
             rm -f '$remote_downloads_tmp'
             rm -f '$remote_merchant_tmp'
             rm -f '$remote_favicon_tmp'
             rm -f '$remote_app_icon_tmp'
             rm -f '$remote_screens_tmp'
             rm -rf \"\$screens_ready\"
             rm -f /tmp/yinnkhome-home-index-ready.html
             rm -f /tmp/yinnkhome-downloads-index-ready.html
             rm -f /tmp/yinnkhome-merchant-index-ready.html
             test -f '$MERCHANT_PUBLIC_DIR/index.html'
             test -f '$MERCHANT_PUBLIC_DIR/downloads/index.html'
             test -f '$MERCHANT_PUBLIC_DIR/merchant/index.html'
             test -f '$MERCHANT_PUBLIC_DIR/favicon.png'
             test -f '$MERCHANT_PUBLIC_DIR/assets/app_icon.png'
             test \"\$(find '$MERCHANT_PUBLIC_DIR/assets/screens' -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')\" = '6'"

      - name: Verify public static URLs
        run: |
          set -euo pipefail
          home_file="$(mktemp)"
          merchant_file="$(mktemp)"
          downloads_file="$(mktemp)"
          curl -fsS https://yinnkhome.com/ -o "$home_file"
          curl -fsS https://yinnkhome.com/merchant/ -o "$merchant_file"
          curl -fsS https://yinnkhome.com/downloads/ -o "$downloads_file"
          grep -q '下载桌面端软件' "$home_file"
          grep -q '在 Mac App Store 下载' "$downloads_file"
          grep -q 'apps.apple.com/cn/app/' "$downloads_file"
          grep -q '在华为应用市场下载' "$downloads_file"
          grep -q 'url.cloud.huawei.com/BSpZw0Kbv2' "$downloads_file"
          ! grep -q 'href="/merchant/"' "$home_file"
          grep -q '商家中心 - 装筱窝' "$merchant_file"
          curl -fsS 'https://yinnkhome.com/favicon.png?v=20260815' -o /dev/null
          curl -fsS https://yinnkhome.com/assets/app_icon.png -o /dev/null
          curl -fsS https://yinnkhome.com/assets/screens/project-overview.jpg -o /dev/null
