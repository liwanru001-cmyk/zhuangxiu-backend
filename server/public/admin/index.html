<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装筱窝 · 管理后台</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=20260815">
<link rel="stylesheet" href="styles.css?v=20260827-remember-login-1">
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <h2>装筱窝管理后台</h2>
    <input id="u-name" placeholder="用户名" autocomplete="username">
    <input id="u-pass" type="password" placeholder="密码" autocomplete="current-password">
    <label class="remember-login"><input id="remember-login" type="checkbox"><span>记住密码</span></label>
    <button onclick="doLogin()">登录</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<div id="main-page">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>装筱窝</h1>
        <p>Web 管理后台</p>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">admin console</div>
    </aside>
    <main class="content">
      <div class="topbar">
        <div>
          <h2 id="page-title">概览</h2>
          <div class="muted" id="page-subtitle">查看平台关键数据</div>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" onclick="refreshCurrent()">刷新</button>
          <button class="ghost-btn" onclick="logout()">退出</button>
        </div>
      </div>
      <section class="page" id="page-content"></section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>编辑用户</h3>
    <label>昵称</label>
    <input id="edit-nickname">
    <label>当前身份</label>
    <select id="edit-role">
      <option value="owner">业主</option>
      <option value="designer">设计师</option>
      <option value="merchant">商家</option>
      <option value="project_manager">项目经理</option>
      <option value="project_supervisor">项目监理</option>
    </select>
    <label>账号审核状态</label>
    <select id="edit-status">
      <option value="pending">待审核</option>
      <option value="approved">已通过</option>
      <option value="rejected">已驳回</option>
    </select>
    <div class="btns">
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="saveUser()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="tip-modal">
  <div class="modal">
    <h3 id="tip-modal-title">编辑日志信息</h3>
    <label>分类</label>
    <select id="tip-type">
      <option value="general">装修贴士</option>
      <option value="function_intro">项目功能说明</option>
    </select>
    <label>标题</label>
    <input id="tip-title" maxlength="80" placeholder="App 显示的标题">
    <label>内容</label>
    <textarea id="tip-content" maxlength="2000" placeholder="App 显示的内容，点击后可查看全文"></textarea>
    <label>排序</label>
    <input id="tip-sort" type="number" placeholder="数字越小越靠前">
    <label>状态</label>
    <select id="tip-active">
      <option value="1">启用</option>
      <option value="0">停用</option>
    </select>
    <div class="btns">
      <button onclick="closeTipModal()">取消</button>
      <button class="primary" onclick="saveProjectTip()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="billing-action-modal">
  <div class="modal">
    <h3 id="billing-action-title">商户操作</h3>
    <div id="billing-action-summary" class="confirm-box"></div>
    <div id="billing-action-fields"></div>
    <div id="billing-action-error" class="field-error"></div>
    <div class="btns">
      <button onclick="closeBillingActionModal()">取消</button>
      <button id="billing-action-submit" class="primary" onclick="submitBillingActionModal()">确认</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="billing-guide-modal">
  <div class="modal billing-guide-modal">
    <div class="billing-guide-title">
      <div>
        <h3>商户管理操作说明</h3>
        <p>给运营、客服、财务处理商户展示付费问题时使用。</p>
      </div>
      <button class="ghost-btn" onclick="closeBillingGuideModal()">关闭</button>
    </div>
    <div class="billing-guide-body" id="billing-guide-content"></div>
  </div>
</div>

<div class="modal-overlay" id="report-confirm-modal" onclick="if(event.target===this) closeReportActionModal()">
  <div class="modal report-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="report-confirm-title">
    <div class="report-confirm-icon">!</div>
    <h3 id="report-confirm-title">确认处理该举报？</h3>
    <p class="report-confirm-description" id="report-confirm-description"></p>
    <div class="report-confirm-summary">
      <div><span>处理对象</span><strong id="report-confirm-target"></strong></div>
      <div><span>处理备注</span><strong id="report-confirm-note"></strong></div>
    </div>
    <div id="report-confirm-error" class="field-error"></div>
    <div class="btns">
      <button onclick="closeReportActionModal()">取消</button>
      <button id="report-confirm-submit" class="primary" onclick="submitReportAction()">确认处理</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="modules/billing.js?v=20260708-company-billing"></script>
<script src="admin.js?v=20260830-release-upload-timeout-2"></script>
</body>
</html>
