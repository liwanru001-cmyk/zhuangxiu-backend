<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后端异常 · 装筱窝管理后台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f6fc; color: #1c2740; font: 15px/1.5 system-ui, sans-serif; }
    button, input, select { font: inherit; }
    .muted, #status { color: #536382; }
    .card, .stat-card { background: #fff; border: 1px solid #dce4f2; border-radius: 12px; }
    .primary-btn { padding: 8px 16px; color: #fff; background: #315dba; border: 0; border-radius: 7px; cursor: pointer; }
    :focus-visible { outline: 2px solid #315dba; outline-offset: 2px; }
    .alerts { max-width: 1090px; margin: 0 auto; padding: 32px 22px; }
    .alerts [hidden] { display: none; }
    .alerts h1 { margin: 16px 0 8px; font-size: 28px; }
    .alerts p { margin: 8px 0 18px; }
    .alerts a { color: #315dba; }
    .alerts form { max-width: 375px; display: grid; gap: 12px; padding: 20px; }
    .alerts form label { display: grid; gap: 6px; }
    .alerts input, .alerts select { padding: 8px; }
    .alerts .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .alerts .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .alerts .stat-card { display: grid; gap: 4px; padding: 16px; }
    .alerts .stat-card strong { font-size: 25px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #edf0f6; }
    th, td:nth-child(n+3) { white-space: nowrap; }
    .alerts .failure { color: #a22531; font-weight: 700; }
    .alerts td:nth-child(2) { overflow-wrap: anywhere; }
    .alerts .card { margin-top: 16px; }
  </style>
  <script src="/api/admin/backend-alerts/client.js" defer></script>
</head>
<body>
<main class="alerts">
  <a href="/admin/">返回管理后台</a>
  <h1>后端异常</h1>
  <p class="muted">查看接口不存在（404）和服务器错误（5xx）。上线后开始记录，页面打开时每分钟更新。</p>
  <form id="login" class="card" hidden>
    <label>管理员账号<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary-btn">登录查看</button>
  </form>
  <section id="dashboard" hidden aria-label="后端异常记录">
    <div class="toolbar">
      <label>时间范围 <select id="days"><option value="1">今天</option><option value="7">最近 7 天</option></select></label>
      <button type="button" class="primary-btn" id="refresh">刷新</button>
    </div>
    <div class="stats">
      <div class="stat-card"><span>接口不存在</span><strong id="missing">—</strong></div>
      <div class="stat-card"><span>服务器错误</span><strong id="server">—</strong></div>
    </div>
    <div class="card table-wrap" id="details">
      <table>
        <thead><tr><th>状态码</th><th>接口</th><th>次数</th><th>首次发生</th><th>最近发生</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </section>
  <p id="status" role="status" aria-live="polite">正在读取异常记录…</p>
</main>
</body>
</html>
